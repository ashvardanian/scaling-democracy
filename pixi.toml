[workspace]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
channels = ["conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
description = "ScalingElections: Condorcet Voting at GPU Speed — Schulze as semiring matrix multiplication, Kemeny-Young as exact NP-hard search"
homepage = "https://ashvardanian.com/posts/scaling-elections"
license = "Apache-2.0"
license-file = "LICENSE"
name = "ScalingElections"
platforms = ["linux-64"]
readme = "README.md"
repository = "https://github.com/ashvardanian/ScalingElections"
version = "0.2.0"

# `mojo` ships separately from `max` now, so pinning `max` alone no longer pins the compiler.
[dependencies]
max = ">=26.5,<27"
mojo = ">=1.0.0,<2"
numpy = ">=2.0"
python = "3.12.*"

# `mojo build -o` writes into a directory but will not create one, and `build/` is ignored.
[tasks]
bench = {cmd = "build/scalingelections --num-candidates 4096 --num-voters 0", depends-on = ["build-cli"]}
build = {cmd = "mojo build scalingelections.mojo --emit shared-lib -o build/scalingelections_mojo.so", depends-on = ["prepare"]}
build-cli = {cmd = "mojo build cli.mojo -o build/scalingelections", depends-on = ["prepare"]}
format = "mojo format -l 120 *.mojo"
prepare = "mkdir -p build"
test = {cmd = "pytest test.py", depends-on = ["build"]}
