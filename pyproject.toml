[project]
authors = [
  {name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com"},
]
dependencies = ["numpy>=2.0"]
description = "ScalingElections: Condorcet Voting at GPU Speed — Schulze as semiring matrix multiplication, Kemeny-Young as exact NP-hard search"
name = "ScalingElections"
readme = "README.md"
requires-python = ">=3.12"
urls = {Homepage = "https://ashvardanian.com/posts/scaling-elections", Repository = "https://github.com/ashvardanian/ScalingElections"}
version = "0.2.0"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83", "pybind11>=3.0.3"]

# NumBa caps NumPy at `<2.5` until 0.67, so the two floors move together.
[project.optional-dependencies]
cpu = ["numba>=0.67", "pytest>=9.1"]

[tool.setuptools]
py-modules = ["scalingelections", "ballots", "schulze", "kemeny"]

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
minversion = "6.0"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "E501", # line too long, handled by the formatter
  "E741", # ambiguous variable names
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort import ordering
  "UP", # pyupgrade
  "YTT", # flake8-2020
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
]

[dependency-groups]
lint = ["ruff>=0.15.8"]
